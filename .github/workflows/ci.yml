name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ${{ github.repository }}/gridwise

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install --upgrade pip
      - run: pip install ruff==0.6.*
      - name: ruff check
        run: ruff check src tests --output-format=github
      - name: ruff format check
        run: ruff format --check src tests

  typecheck:
    name: typecheck (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: mypy src --strict --config-file=pyproject.toml

  test:
    name: pytest
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    env:
      OPENAI_API_KEY: ci-placeholder
      GRIDWISE_ENABLE_FALLBACK_PARSER: "true"
      REDIS_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: unit + integration
        run: |
          pytest \
            --cov=src/app \
            --cov=src/llm \
            --cov=src/optimizer \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            --junitxml=junit.xml \
            --strict-markers \
            -ra tests/unit tests/integration
      - name: coverage gate
        if: always()
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          t = float(ET.parse('coverage.xml').getroot().attrib['line-rate']) * 100
          print(f'coverage: {t:.2f}%')
          assert t >= 80.0, f'coverage {t:.2f}% < 80%'
          "
      - name: upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.event.pull_request.number || github.ref }}
          path: junit.xml

  security-scan:
    name: security (trivy)
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      id-token: write  # required for AWS deploy via OIDC
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number || github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
          provenance: false

  terraform-validate:
    name: terraform validate
    runs-on: ubuntu-latest
    needs: [test]
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.*
      - name: terraform fmt check
        run: terraform fmt -check -recursive -diff
      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate
